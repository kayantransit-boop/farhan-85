<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34bcf5"/>
      <stop offset="100%" stop-color="#0078b8"/>
    </linearGradient>
    <linearGradient id="greenG" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1ed44a"/>
      <stop offset="100%" stop-color="#0a8a20"/>
    </linearGradient>
    <clipPath id="lc"><rect x="0" y="0" width="100" height="200"/></clipPath>
    <clipPath id="rc"><rect x="100" y="0" width="100" height="200"/></clipPath>
  </defs>

  <!-- Heart — left half (blue) -->
  <path d="M100,168 C58,145 18,118 18,76 C18,50 38,30 62,30 C77,30 89,38 100,52 C111,38 123,30 138,30 C162,30 182,50 182,76 C182,118 142,145 100,168Z"
    fill="url(#blueG)" clip-path="url(#lc)"/>

  <!-- Heart — right half (green) -->
  <path d="M100,168 C58,145 18,118 18,76 C18,50 38,30 62,30 C77,30 89,38 100,52 C111,38 123,30 138,30 C162,30 182,50 182,76 C182,118 142,145 100,168Z"
    fill="url(#greenG)" clip-path="url(#rc)"/>

  <!-- Center bond line -->
  <line x1="100" y1="52" x2="100" y2="168" stroke="white" stroke-width="2.5" opacity="0.4"/>

  <!-- Top junction dot (meeting of two humps) -->
  <circle cx="100" cy="52" r="10" fill="white" opacity="0.95"/>

  <!-- Bottom location-pin dot -->
  <circle cx="100" cy="168" r="8" fill="white" opacity="0.85"/>
  <circle cx="100" cy="168" r="4" fill="rgba(255,255,255,0.45)"/>
</svg>
